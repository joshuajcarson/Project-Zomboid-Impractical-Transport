name: checks
# Cheap checks that need no game: file references, XML, Lua syntax, no merge leftovers. The real test (booting the game and a server and riding every
# transport) cannot run on a GitHub runner; it is run locally before pushing and its output is pasted in the pull request.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y --no-install-recommends lua5.1
      - run: python scripts/smoke_test.py static
      - run: python scripts/check_repo.py
